<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Background circle with student tech theme -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="#0F172A" />
  <rect x="7" y="7" width="86" height="86" rx="26" stroke="url(#blue-grad)" stroke-width="2.5" />
  
  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Wi-Fi Signals radiating upwards -->
  <path d="M22 34 A36 36 0 0 1 78 34" stroke="url(#blue-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.45" />
  <path d="M30 42 A26 26 0 0 1 70 42" stroke="url(#blue-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
  <path d="M38 50 A16 16 0 0 1 62 50" stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" />

  <!-- Student Graduation Mortarboard / Laptop emblem -->
  <!-- Cap Diamond Top -->
  <polygon points="50,56 74,66 50,74 26,66" fill="url(#cap-grad)" />
  <!-- Cap Base -->
  <path d="M36 71.5 V 78 C36 82, 64 82, 64 78 V 71.5" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M70 68 L73 78" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="73" cy="79.5" r="2" fill="#F97316" />

  <!-- Center WiFi Core Dot -->
  <circle cx="50" cy="56" r="3.5" fill="#FFFFFF" />
</svg>
